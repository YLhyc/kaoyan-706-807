name: CI Fast Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install beautifulsoup4
      - name: Run fast contract & sync gates
        run: python tests/run_release_gate.py --fast
